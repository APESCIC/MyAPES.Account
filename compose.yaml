# Local development: http://myaccount.myapes.test:8081 (see README "Local development with Docker").
# Fake data only. Cloudron does not use this file.
# Start or reuse the stack with scripts/local/docker-preview.ps1 (or .sh); it checks for existing containers first.
name: myapes-account

services:
    app:
        build: docker/php
        volumes:
            - .:/app
        environment:
            # Real environment variables win over .env, so these keep the container working
            # even when .env still holds host-only paths.
            APP_URL: http://myaccount.myapes.test:8081
            OIDC_REDIRECT_URI: http://myaccount.myapes.test:8081/staff/auth/callback
            DB_CONNECTION: sqlite
            DB_DATABASE: /app/database/database.sqlite
            VITE_DEV_SERVER_URL: http://myaccount.myapes.test:5175

    web:
        image: caddy:2-alpine
        ports:
            # 8081, so it does not clash with Laragon on 80 or the APES Intranet on 8080.
            - "8081:80"
        volumes:
            - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
            - .:/app:ro
        depends_on:
            - app

    node:
        build: docker/node
        working_dir: /app
        command: sh -c "npm ci --no-audit --no-fund && npm run dev"
        environment:
            VITE_DEV_HOST: myaccount.myapes.test
            # 5175, so it does not clash with Laragon's Vite on 5173 or the APES Intranet on 5174.
            VITE_PORT: "5175"
        ports:
            - "5175:5175"
        volumes:
            - .:/app
            # Linux packages, kept apart from any Windows node_modules on the host.
            - node_modules:/app/node_modules

volumes:
    node_modules:
