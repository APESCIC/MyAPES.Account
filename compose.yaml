# Local development: http://myaccount.myapes.test:8081 (see README "Local development with Docker").
# Fake data only. Cloudron does not use this file.
# Start or reuse the stack with scripts/local/docker-preview.ps1 (or .sh); it checks for existing containers first.
name: myapes-account

services:
    app:
        build: docker/php
        volumes:
            - .:/app
            # Linux Composer packages in a volume: PHP on a Windows bind mount is too slow for vendor/.
            - vendor:/app/vendor
            # Compiled views, file sessions and file cache, for the same reason.
            - framework:/app/storage/framework
        # No app settings here: container environment variables would override phpunit.xml
        # and point the test suite at the local database. docker-preview sets them in .env.

    web:
        image: caddy:2-alpine
        ports:
            # 8081, so it does not clash with Laragon on 80 or the APES Intranet on 8080.
            - "8081:80"
        volumes:
            - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
            - .:/app:ro
        depends_on:
            - app

    node:
        build: docker/node
        working_dir: /app
        command: sh -c "npm ci --no-audit --no-fund && npm run dev"
        environment:
            VITE_DEV_HOST: myaccount.myapes.test
            # 5175, so it does not clash with Laragon's Vite on 5173 or the APES Intranet on 5174.
            VITE_PORT: "5175"
        ports:
            - "5175:5175"
        volumes:
            - .:/app
            # Linux packages, kept apart from any Windows node_modules on the host.
            - node_modules:/app/node_modules

volumes:
    node_modules:
    vendor:
    framework:
