# Manual Laragon virtual host for MyAPES Account.
#
# Only needed when Auto Virtual Hosts is turned off. Copy this file to
# C:\laragon\etc\apache2\sites-enabled\myapes-account.test.conf (no "auto." prefix,
# so Laragon keeps it as written), then use Menu > Apache > Reload.
# Change ROOT if the project folder is not C:\laragon\www\myapes-account.

define ROOT "C:/laragon/www/myapes-account/public"
define SITE "myapes-account.test"

<VirtualHost *:80>
    DocumentRoot "${ROOT}"
    ServerName ${SITE}
    ServerAlias *.${SITE}
    <Directory "${ROOT}">
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:443>
    DocumentRoot "${ROOT}"
    ServerName ${SITE}
    ServerAlias *.${SITE}
    <Directory "${ROOT}">
        AllowOverride All
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile      C:/laragon/etc/ssl/laragon.crt
    SSLCertificateKeyFile   C:/laragon/etc/ssl/laragon.key
</VirtualHost>
