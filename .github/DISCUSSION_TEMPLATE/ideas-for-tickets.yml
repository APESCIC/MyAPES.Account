title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: Share an idea for Tickets. Good ideas may become issues on a milestone.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true
  - type: dropdown
    id: who
    attributes:
      label: Who would benefit?
      multiple: true
      options:
        - Public users
        - Staff, volunteers and students
        - Admins
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and security
      options:
        - label: I have removed personal data (names, emails, phone numbers, client, pet, case or medical details).
          required: true
        - label: This is not a security problem (those go to SECURITY.md and a private advisory).
          required: true
